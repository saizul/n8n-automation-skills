name: Improve a skill
description: A new check, a better workflow step, a missing edge case or clearer docs
labels: ["enhancement"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: "n8n-workflow-lint"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should change and why?
      description: For a new check, include a minimal workflow JSON that should (and one that should not) trigger it.
    validations:
      required: true
